name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: acc-x86_64-linux.tar.gz
            binary_name: acc
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: acc-aarch64-linux.tar.gz
            binary_name: acc
            linker: aarch64-linux-gnu-gcc
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact_name: acc-x86_64-macos.tar.gz
            binary_name: acc
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: acc-aarch64-macos.tar.gz
            binary_name: acc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Cross-Compilation Toolchain (AArch64 Linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Build Binary
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Package Binary Artifact
        run: |
          mkdir -p bin_dist
          cp target/${{ matrix.target }}/release/acc bin_dist/
          cp README.md LICENSE bin_dist/ 2>/dev/null || true
          tar -czvf ${{ matrix.artifact_name }} -C bin_dist .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  github-release:
    name: Create GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: acc-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: acc-*.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

