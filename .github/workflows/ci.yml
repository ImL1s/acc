name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build & Test Suite (Ubuntu Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh build-essential gcc g++ make ripgrep qemu-system-arm qemu-user qemu-user-static gcc-aarch64-linux-gnu gcc-i686-linux-gnu tcl-dev

      - name: Cargo Check & Code Format
        run: |
          cargo check
          cargo fmt --check --quiet || true

      - name: Cargo Unit Tests & Build Binary
        run: |
          cargo test --release
          cargo build --release

      - name: Verify acc Binary Target
        run: |
          ./target/release/acc --help || ./target/release/acc -E - < /dev/null

      - name: Run In-Repo Oracle Suite
        run: |
          ./harness/run_oracle.sh

      - name: Run Public c-testsuite (Stage A & B)
        run: |
          CTEST_MIN_PASS=200 ./harness/run_ctestsuite.sh

      - name: Run Dual-ISA Multiarch Suite (Stage C3)
        run: |
          ./harness/run_multiarch.sh

      - name: Run Mutation & Anti-Bypass Audit (Stage C4)
        run: |
          ./harness/mutation_check.sh
          ./scripts/anti_bypass_audit.sh

      - name: Run Real-World Project Wrappers (Stage B)
        run: |
          CC=$PWD/target/release/acc third_party/real/miniz/build.sh test
          CC=$PWD/target/release/acc third_party/real/lua/build.sh test
          CC=$PWD/target/release/acc third_party/real/sqlite/build.sh test
